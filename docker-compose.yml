services:
  postgres:
    image: postgres:16
    container_name: vinyl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vinyl
      POSTGRES_PASSWORD: vinyl
      POSTGRES_DB: vinyl
    ports:
      - '5432:5432'
    volumes:
      - vinyl-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vinyl -d vinyl']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vinyl-pgdata:
