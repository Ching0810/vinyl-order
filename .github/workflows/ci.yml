# Checks every pull request, and main after a merge, with the same commands we
# run locally. Four jobs rather than one so a red check names the failure in
# the PR list, and so lint doesn't wait for a database to boot.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels the run still working on the previous commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs the Node version in .nvmrc — the one nvm picks locally and the
# API's Dockerfile builds on — rather than whatever "24" means on the day.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # --frozen-lockfile: a lockfile that doesn't match package.json fails
      # here rather than quietly resolving to different versions.
      # postinstall generates the Prisma client, which is not in version control.
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest

    # Matches apps/api/.env.test and apps/mockpay/.env.test exactly — those
    # files are committed and hold only test values, so the suite needs no
    # secrets. The database names must end in _test or global-setup refuses to
    # reset them.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vinyl
          POSTGRES_PASSWORD: vinyl
          POSTGRES_DB: vinyl_test
        ports:
          - 5432:5432
        # Without this the tests start before Postgres accepts connections.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The api imports @vinyl-order/shared and @vinyl-order/mockpay at runtime
      # from their dist, so the tests need them built — types alone resolve
      # from src. "api^..." is everything the api depends on in the workspace,
      # but not the api itself, so a new workspace package needs no edit here.
      - run: pnpm --filter "api^..." build
      # The service creates one database (POSTGRES_DB); MockPay's, kept apart
      # from ours, is made here.
      - run: createdb -h localhost -U vinyl mockpay_test
        env:
          PGPASSWORD: vinyl
      # test/global-setup.ts replays every migration into vinyl_test and
      # mockpay_test, so there is no migration step here.
      - run: pnpm --filter api test:e2e

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Catches what tsc alone doesn't: the React Compiler, Next's route
      # collection, and the Nest build.
      - run: pnpm build

  # The API's image builds (docs/design/deploy.md §8): a change that breaks it —
  # a new workspace package the Dockerfile doesn't copy, a dependency that
  # needs a script — fails here, not on the platform at deploy time. Built,
  # never pushed: the platform builds its own from the same Dockerfile.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          # Layers cached between runs, the build stage's too (mode=max), so
          # an unchanged lockfile skips the install.
          cache-from: type=gha
          cache-to: type=gha,mode=max
