packages:
  - apps/*
  - packages/*

# One version for packages that must be the same instance across workspace
# packages. MockPay is mounted inside the API and takes Nest as a peer: it only
# shares the API's copy if both resolve the very same version (and the same
# versions of Nest's own peers, rxjs and reflect-metadata). Two copies of Nest
# means two ConfigService classes, and dependency injection fails at boot.
#
# Prisma is here for a different reason: the API and MockPay each generate a
# client of their own, but one version means one set of engines to install and
# one changelog to read on upgrade.
catalog:
  '@nestjs/common': ^11.2.8
  '@nestjs/config': ^4.0.4
  '@nestjs/core': ^11.2.8
  '@nestjs/platform-express': ^11.2.8
  '@prisma/adapter-pg': ^7.10.1
  '@prisma/client': ^7.10.1
  nestjs-zod: ^5.5.0
  prisma: ^7.10.1
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  zod: ^4.6.7

allowBuilds:
  '@nestjs/core': false
  '@parcel/watcher': false
  '@prisma/engines': false
  bcrypt: true
  prisma: false
  sharp: false
  unrs-resolver: false

# Security fixes for packages a parent pins to a vulnerable version. Each
# applies only below the fixed version, so it falls away once the parent
# catches up — check with `pnpm why <package>` and remove it then.
overrides:
  # @nestjs/platform-express 11.2.8 pins multer 2.4.0; 2.5.0 fixes a DoS
  # (GHSA: pending async fileFilter after request teardown). Uploads ship.
  'multer@<2.5.0': ^2.5.0
